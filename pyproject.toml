[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cleargrad-course-api"
version = "0.3.0"
description = "Validated, versioned NSYSU course snapshots for ClearGrad"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ClearGrad contributors" }]
dependencies = [
  "aiohttp>=3.11,<4",
  "beautifulsoup4>=4.12,<5",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[project.scripts]
cleargrad-course-api = "cleargrad_course_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cleargrad_course_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
