name: Sync and deploy course API

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      semester:
        description: Optional four-digit NSYSU semester code, for example 1151
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: course-api-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check adaptive crawl cadence
        id: cadence
        shell: bash
        env:
          PUBLIC_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--url "$PUBLIC_BASE/cadence.json")
          if [[ "$FORCE_SYNC" == "true" ]]; then
            args+=(--force)
          fi
          python scripts/check_cadence.py "${args[@]}"

      - name: Set up Python
        if: steps.cadence.outputs.due == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        if: steps.cadence.outputs.due == 'true'
        run: python -m pip install .

      - name: Restore, validate, and publish the latest snapshot
        if: steps.cadence.outputs.due == 'true'
        shell: bash
        env:
          REQUESTED_SEMESTER: ${{ inputs.semester }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          public_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}"
          args=(sync --output site --reports reports --hydrate-from "$public_base")
          if [[ -n "$REQUESTED_SEMESTER" ]]; then
            args+=(--semester "$REQUESTED_SEMESTER")
          fi
          set +e
          cleargrad-course-api "${args[@]}"
          sync_status=$?
          set -e
          if [[ "$sync_status" -ne 0 ]]; then
            echo "::warning title=Course sync deferred::Upstream sync failed; last-known-good course data remains active and cadence backoff will be published."
          fi
          cleargrad-course-api audit --output site

      - name: Configure Pages
        if: steps.cadence.outputs.due == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.cadence.outputs.due == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.due == 'true'
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
