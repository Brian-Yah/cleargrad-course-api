name: Sync and deploy course API

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      semester:
        description: Optional four-digit NSYSU semester code, for example 1151
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: course-api-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Restore, validate, and publish the latest snapshot
        shell: bash
        env:
          REQUESTED_SEMESTER: ${{ inputs.semester }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          public_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}"
          args=(sync --output site --reports reports --hydrate-from "$public_base")
          if [[ -n "$REQUESTED_SEMESTER" ]]; then
            args+=(--semester "$REQUESTED_SEMESTER")
          fi
          cleargrad-course-api "${args[@]}"
          cleargrad-course-api audit --output site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
